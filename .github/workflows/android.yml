name: Reia Android ARM64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/darkhan-title-and-admin-foundation
    paths:
      - "godot/**"
      - "rust/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: reia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Rust ARM64 + Godot 4.7 APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Verify Godot and Android toolchain
        run: |
          godot --version
          java -version
          test -n "${ANDROID_HOME:-}" || test -n "${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager
          sdkmanager --install "ndk;28.1.13356709"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Install Rust and Android target
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --target aarch64-linux-android
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          cargo install cargo-ndk --locked
          rustc --version
          cargo ndk --version

      - name: Restore Git LFS assets
        run: |
          git lfs install
          git lfs pull
          git submodule update --init --recursive

      - name: Build Rust GDExtension for Android ARM64
        working-directory: rust
        shell: bash
        run: |
          cargo ndk -t arm64-v8a build
          cargo ndk -t arm64-v8a build --release
          mkdir -p ../godot/build/bin
          install -m 755 target/aarch64-linux-android/debug/libreia_backend.so ../godot/build/bin/libreia_backend.android.debug.arm64.so
          install -m 755 target/aarch64-linux-android/release/libreia_backend.so ../godot/build/bin/libreia_backend.android.release.arm64.so
          file ../godot/build/bin/libreia_backend.android.debug.arm64.so
          file ../godot/build/bin/libreia_backend.android.release.arm64.so

      - name: Import and validate Godot 4.7 project
        run: |
          cd godot
          godot --headless --editor --path . --import
          godot --headless --editor --path . --quit

      - name: Export Android ARM64 debug APK
        run: |
          mkdir -p build/android
          cd godot
          godot --headless --verbose --path . --export-debug android ../build/android/Reia-Android-debug.apk
          test -s ../build/android/Reia-Android-debug.apk
          unzip -l ../build/android/Reia-Android-debug.apk | grep -E 'lib/arm64-v8a/.*reia_backend.*\.so'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Reia-Android-ARM64-APK
          path: build/android/Reia-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
